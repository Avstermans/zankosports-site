<title>ZANKO Launching Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* One centred column: logo, the whole white glove, the name, one email box.
     Meeraj, 11 Oct 2026: "look cleaner, show the whole glove in white colour and keep
     text central". The split black/white band this replaces is kept as
     preorder_split_band_version_2026-10-11.html. */

  html{color-scheme:dark}

  :root{
    --ink:#08080A;
    --bone:#EDEAE4;
    --ash:#8E8A83;
    --rule:rgba(237,234,228,.15);
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --gutter:clamp(1rem,5vw,3rem);
    /* the glove takes this share of the screen height; the email box stays on screen below it */
    --glove-h:42svh;
  }
  @media (max-height:620px){:root{--glove-h:33svh}}

  *{box-sizing:border-box}

  body{
    margin:0;
    background:#000;          /* the photo is shot on black: anything lighter shows a dark oval around the glove */
    color:var(--bone);
    font-family:var(--display);
    line-height:1.6;
    text-align:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  img{display:block;max-width:100%}
  ::selection{background:var(--bone);color:var(--ink)}
  :focus-visible{outline:2px solid currentColor;outline-offset:3px}

  .lab{font-family:var(--mono);font-size:.625rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .page{
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top,0px) var(--gutter) env(safe-area-inset-bottom,0px);
  }

  /* -- the logo, centred -- */
  .mark{display:block;padding-block:clamp(1rem,3vw,1.6rem) .25rem}
  .mark img{width:auto;height:clamp(2rem,6.2vw,2.8rem);margin-inline:auto}

  /* -- the glove: the whole white glove, never cropped. The photo is the glove on black,
        so its edges fade into the page instead of showing a box. -- */
  .glove{margin:0;width:100%;display:grid;place-items:center}
  .glove img{
    /* a square crop of the centred glove: the glove reads bigger, still whole */
    width:min(100%,520px,var(--glove-h));
    height:auto;aspect-ratio:1;object-fit:cover;object-position:50% 50%;
    -webkit-mask-image:radial-gradient(closest-side,#000 76%,transparent 100%);
            mask-image:radial-gradient(closest-side,#000 76%,transparent 100%);
  }

  /* -- the words and the box -- */
  .main{width:100%;max-width:640px;display:grid;justify-items:center}
  .note,form{max-width:420px}

  .name{
    font-stretch:122%;font-weight:800;
    font-size:clamp(2rem,9vw,3.6rem);line-height:.95;letter-spacing:.01em;
    margin:.15rem 0 0;
  }
  .soon{font-stretch:110%;font-weight:600;font-size:clamp(1.05rem,3.8vw,1.35rem);margin:.7rem 0 0}
  .note{color:var(--ash);font-size:.9375rem;margin:.35rem 0 0;text-wrap:balance}

  form{width:100%;margin-top:clamp(1.1rem,3vw,1.6rem);display:grid;gap:.75rem}

  input[type=email],input[type=text]{
    font-family:var(--display);font-size:1rem;text-align:center;
    background:rgba(237,234,228,.05);color:var(--bone);
    border:1px solid rgba(237,234,228,.28);border-radius:2px;
    padding:.95rem 1rem;width:100%;min-height:56px;
  }
  input::placeholder{color:var(--ash);opacity:1}
  input:focus{border-color:var(--bone);outline:none;background:rgba(237,234,228,.08)}

  .go{
    appearance:none;border:1px solid var(--bone);background:var(--bone);color:var(--ink);
    font-family:var(--mono);font-size:.75rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;
    padding:1.1rem 1.4rem;border-radius:2px;width:100%;cursor:pointer;min-height:56px;
    transition:opacity .2s ease,transform .1s ease;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  @media (hover:hover){.go:hover{opacity:.86}}
  .go:active{transform:scale(.99)}
  .go[disabled]{opacity:.45;cursor:default}

  .honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .say{margin:0;min-height:1.4em;font-family:var(--mono);font-size:.75rem;line-height:1.6}
  .say--err{color:#E8837B}
  .say--ok{color:#8FC79A}

  .fine{color:var(--ash);font-family:var(--mono);font-size:.6875rem;line-height:1.8;margin:0;text-wrap:balance}

  /* -- footer: just the address, centred -- */
  .foot{margin-top:auto;padding-block:2.2rem 2.6rem;color:var(--ash)}
  .foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);
          padding-block:.75rem;display:inline-flex;align-items:center;min-height:44px}
  .foot a:active{color:var(--bone)}
  @media (hover:hover){.foot a:hover{color:var(--bone);border-bottom-color:currentColor}}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

<div class="page">

  <a class="mark" href="#" aria-label="Zanko Sports">
    <img src="img/logo-main.webp" width="1600" height="364" alt="Zanko Sports" fetchpriority="high">
  </a>

  <figure class="glove">
    <img src="img/pair-white.webp" width="1760" height="1100" fetchpriority="high"
         alt="The Zanko Hybrid 360 boxing glove in white, hanging by its laces.">
  </figure>

  <main class="main">
    <h1 class="name">HYBRID 360</h1>
    <p class="soon">Launching soon.</p>
    <p class="note">Leave your email and we will tell you the day it drops.</p>

    <form id="form" novalidate>
      <label class="sr" for="email">Your email</label>
      <input type="email" id="email" name="email" placeholder="Your email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>

      <div class="honey" aria-hidden="true">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
      </div>

      <button class="go" type="submit" id="go">Notify me</button>
      <p class="say" id="say" role="status" aria-live="polite"></p>

      <p class="fine">One email when we launch. We will not pass your address to anyone.</p>
    </form>
  </main>

  <footer class="foot lab">
    <a href="mailto:sales@zankosports.com">sales@zankosports.com</a>
  </footer>

</div>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   The waiting list.

   ENDPOINT is the Apps Script web app that writes each sign-up to the
   "Zanko - waiting list" sheet and emails the alert. Until it is set the form
   says so rather than pretending a sign-up worked, because a form that
   silently throws addresses away during a paid campaign is the most expensive
   bug available.
   ────────────────────────────────────────────────────────────────────────── */
(function () {
  "use strict";

  var ENDPOINT = "https://script.google.com/macros/s/AKfycbxElpVKlqjUVwmGlr85jYEWgm0PI-BJrl59Liz8TkhWa8y9jzq5nyl81RkeJjsWpzeS/exec";

  var form  = document.getElementById("form");
  var email = document.getElementById("email");
  var go    = document.getElementById("go");
  var say   = document.getElementById("say");


  function tell(msg, kind) {
    say.textContent = msg;
    say.className = "say" + (kind ? " say--" + kind : "");
    // on a phone the status line can sit under the keyboard or below the fold, and a
    // sign-up that shows nothing reads as broken: close the keyboard, bring it into view
    if (kind) { email.blur(); }
    say.scrollIntoView({block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var addr = email.value.trim();
    // deliberately loose: an over-strict pattern rejects real addresses
    if (!addr || addr.indexOf("@") < 1 || addr.lastIndexOf(".") < addr.indexOf("@")) {
      tell("That email does not look right — check it and try again.", "err");
      email.focus();
      return;
    }
    if (document.getElementById("company").value) return;   // bot

    var payload = {
      email: addr,
      source: location.pathname + location.search,
      at: new Date().toISOString()
    };

    if (!ENDPOINT) {
      tell("This form is not connected yet — nothing was saved.", "err");
      console.warn("Zanko waiting list: set ENDPOINT before running traffic.", payload);
      return;
    }

    go.disabled = true;
    tell("Adding you…");

    fetch(ENDPOINT, {
      method: "POST",
      mode: "no-cors",                       // Apps Script and most form services
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      form.querySelectorAll("input,button").forEach(function (n) { n.disabled = true; });
      tell("You are in. We will email " + addr + " the day it drops.", "ok");
    }).catch(function () {
      go.disabled = false;
      tell("That did not send. Try again in a moment.", "err");
    });
  });
})();
</script>
</html>
